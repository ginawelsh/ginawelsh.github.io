<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <title>Writing – Gina Welsh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-sans: "Nunito", sans-serif;
      --font-mono: "IBM Plex Mono", "Courier New", monospace;
      --bg:          #ffffff;
      --bg-subtle:   #f5f5f4;
      --text:        #1c1917;
      --text-muted:  #873d08;
      --accent:      #c2410c;
      --accent-2:    #1d4ed8;
      --border:      #e7e5e4;
      --max-w: 48rem;
    }

    html.dark {
      --bg:          #1c1917;
      --bg-subtle:   #292524;
      --text:        #f5f5f4;
      --text-muted:  #a8a29e;
      --accent:      #fb923c;
      --accent-2:    #93c5fd;
      --border:      #44403c;
    }

    body {
      font-family: var(--font-sans);
      font-size: 1rem;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 1.25rem;
      transition: background 0.2s, color 0.2s;
    }

    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--accent); }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    .site-header {
      display: flex;
      flex-direction: column;
      padding: 1.25rem 0 0.75rem;
      margin-bottom: 2rem;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .site-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.625rem;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .header-actions { display: flex; align-items: center; gap: 0.25rem; }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 0.375rem;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: color 0.15s;
    }
    .icon-btn:hover { color: var(--accent); }
    .icon-btn svg { width: 1.5rem; height: 1.5rem; }

    .nav-menu { display: flex; gap: 0.1rem; margin-top: 0.5rem; flex-wrap: wrap; }

    .nav-link {
      padding: 0.25rem 0.625rem;
      border-radius: 0.375rem;
      font-size: 0.95rem;
      color: var(--text-muted);
      transition: color 0.15s, background 0.15s;
    }
    .nav-link:hover,
    .nav-link[aria-current="page"] { color: var(--accent); background: var(--bg-subtle); }

    main { max-width: 38rem; }

    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 1.5rem; }

    .post-list { list-style: none; display: flex; flex-direction: column; gap: 1.75rem; }

    .post-item { display: flex; flex-direction: column; gap: 0.25rem; }

    .post-date {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent);
      opacity: 0.85;
    }

    .post-title { font-size: 1rem; font-weight: 600; }
    .post-title a:hover { color: var(--accent); }

    .post-excerpt { font-style: italic; color: var(--text-muted); font-size: 0.925rem; }

    .empty-note { color: var(--text-muted); font-style: italic; }

    .site-footer {
      margin-top: 4rem;
      padding: 1.5rem 0 2rem;
      border-top: 1px solid var(--border);
    }

    .footer-nav { display: flex; flex-wrap: wrap; gap: 0.25rem; align-items: center; margin-bottom: 1.25rem; }

    .footer-link {
      font-size: 0.875rem;
      color: var(--text-muted);
      padding: 0.1rem 0.4rem;
      border-radius: 0.25rem;
      transition: color 0.15s;
    }
    .footer-link:hover,
    .footer-link[aria-current="page"] { color: var(--accent); }

    .footer-sep { color: var(--text-muted); font-size: 0.75rem; }

    .social-row { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; }
    .social-list { list-style: none; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .social-link { display: flex; color: var(--text-muted); transition: color 0.15s; }
    .social-link:hover { color: var(--accent); }
    .social-link svg { width: 1.4rem; height: 1.4rem; }
  </style>
</head>

  <script>
    const html = document.documentElement;
    const sunIcon  = document.getElementById('icon-sun');
    const moonIcon = document.getElementById('icon-moon');

    function applyTheme(theme) {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = theme === 'dark' || (theme === 'system' && prefersDark);
      html.classList.toggle('dark', isDark);
      sunIcon.style.display  = isDark ? 'block' : 'none';
      moonIcon.style.display = isDark ? 'none'  : 'block';
    }

    const stored = localStorage.getItem('theme') || 'system';
    applyTheme(stored);

    document.getElementById('themeToggle').addEventListener('click', () => {
      const current = localStorage.getItem('theme') || 'system';
      const next = current === 'system' ? 'light' : current === 'light' ? 'dark' : 'system';
      localStorage.setItem('theme', next);
      applyTheme(next);
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if ((localStorage.getItem('theme') || 'system') === 'system') applyTheme('system');
    });
  </script>
